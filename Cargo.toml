[package]
name = "nu_plugin_toon"
version = "0.1.0"
authors = ["Darren Schroeder <343840+fdncred@users.noreply.github.com>"]
edition = "2021"
description = "a nushell plugin called toon"
repository = "https://github.com/fdncred/nu_plugin_toon"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# for local development, you can use a path dependency
# nu-plugin = { path = "../nushell/crates/nu-plugin" }
# nu-protocol = { path = "../nushell/crates/nu-protocol", features = ["plugin"] }
nu-plugin = "0.115.0"
nu-protocol = { version = "0.115.0", features = ["plugin"] }
serde_json = "1.0.151"
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
# nu-plugin-test-support = { path = "../nushell/crates/nu-plugin-test-support" }
nu-plugin-test-support = { version = "0.115.0" }
# test-support drops nu-plugin-engine's `local-socket` feature, breaking cargo
# test with E0004; re-enable it here (test-only, production unchanged).
nu-plugin-engine = { version = "0.115.0", features = ["local-socket"] }

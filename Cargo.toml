[package]
name = "nu_plugin_toon"
version = "0.1.0"
authors = ["Darren Schroeder <343840+fdncred@users.noreply.github.com>"]
edition = "2021"
description = "a nushell plugin called toon"
repository = "https://github.com/fdncred/nu_plugin_toon"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# for local development, you can use a path dependency
# nu-plugin = { path = "../nushell/crates/nu-plugin" }
# nu-protocol = { path = "../nushell/crates/nu-protocol", features = ["plugin"] }
nu-plugin = "0.115.0"
nu-protocol = { version = "0.115.0", features = ["plugin"] }
serde_json = "1.0.151"
toon-format = { version = "0.5.0", default-features = false }

[dev-dependencies]
# nu-plugin-test-support = { path = "../nushell/crates/nu-plugin-test-support" }
nu-plugin-test-support = { version = "0.115.0" }
# test-support pulls nu-plugin-engine with default-features = false, which drops
# its `local-socket` feature while nu-plugin (default features) enables
# nu-plugin-core/local-socket. That mismatch leaves an unhandled enum variant in
# nu-plugin-engine and cargo test fails with E0004. Re-enable it here so engine
# and core agree (test-only; production transport unchanged).
nu-plugin-engine = { version = "0.115.0", features = ["local-socket"] }
